[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Filenames are NOT content-hashed and files are replaced in place (styles.css,
# logos, application PDFs). "immutable" would pin a stale copy in browsers for a
# year, so always revalidate — Netlify's ETags make an unchanged file a cheap 304.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Old Wix and pre-Wix (.aspx) URLs that Google still has indexed. 301s pass
# their ranking to the matching page on this site instead of dropping it on a 404.
# force = true where Netlify's pretty-URL lookup would otherwise serve a
# duplicate of the .html page at the extensionless path.
[[redirects]]
  from = "/applications"
  to = "/applications.html"
  status = 301
  force = true
